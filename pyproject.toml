[project]
name = "customer-support-assistant"
version = "0.1.0"
description = "Customer support RAG assistant evaluated with RAGAS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langchain-community<0.4",
    "langfuse>=3.0",
    "markdownify>=0.13",
    "numpy>=1.26",
    "openai>=1.99",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "ragas>=0.4.3",
    "selectolax>=1.0",
    "typer>=0.12",
]

[project.scripts]
kb = "kb_builder.cli:app"
support = "support_assistant.cli:app"
evals = "evaluation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_builder", "src/support_assistant", "src/evaluation"]
