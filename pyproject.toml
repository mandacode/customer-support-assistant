[project]
name = "customer-support-assistant"
version = "0.1.0"
description = "Customer support RAG assistant evaluated with RAGAS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "selectolax>=1.0",
    "typer>=0.12",
]

[project.scripts]
kb = "kb_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_builder"]
